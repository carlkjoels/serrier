# Publicerar Python-paketet `serrier` till PyPI när en GitHub-release publiceras.
# Trusted Publishing (OIDC): INGEN PyPI-token lagras i repot eller i GitHub-secrets — PyPI
# litar på just det här workflowet i just det här repot (konfigureras en gång på pypi.org).
# Actions är pinnade till commit-SHA (leveranskedja); taggen står i kommentaren.
name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262          # v4
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e        # v6

      - name: Taggen måste matcha paketversionen
        working-directory: backend
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$VERSION" = "$TAG" ] || { echo "tagg $TAG != version v$VERSION"; exit 1; }

      - name: Lint + tester (grind före publicering)
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check serrier tests migrations
          uv run pytest -q

      - name: Bygg wheel + sdist
        working-directory: backend
        run: |
          uv build --out-dir ../dist
          uvx twine check --strict ../dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with: { name: dist, path: dist/, if-no-files-found: error }

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/serrier/
    permissions:
      id-token: write          # OIDC mot PyPI — enda jobbet som får det
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1

  attach:
    # Samma filer som gick till PyPI bifogas GitHub-releasen (en källa, samma checksummor).
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: dist, path: dist/ }
      - name: Bifoga till releasen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
