[project]
name = "serrier-backend"
version = "0.0.1"
description = "Serrier.ai — security intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "anthropic>=2.6.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PL", "RUF", "ANN", "PT"]
# RUF001-003: typografiska tecken (… → × –) i svenska kommentarer är avsiktliga.
ignore = ["ANN401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["serrier*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
