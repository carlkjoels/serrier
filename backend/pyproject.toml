[project]
name = "serrier"
version = "0.2.2"
description = "Local security for AI-assisted development: repo scanner + Pre-Send Guardian"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["security", "secrets", "ai", "llm", "proxy", "scanner", "dlp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
  "httpx>=0.28",
  "anthropic>=2.6.0",
  "alembic>=1.13",
]

[project.urls]
Homepage = "https://github.com/carlkjoels/serrier"
Repository = "https://github.com/carlkjoels/serrier"
Issues = "https://github.com/carlkjoels/serrier/issues"
Changelog = "https://github.com/carlkjoels/serrier/releases"

[project.optional-dependencies]
# Postgres-drivrutin — bara i container/prod. SQLite kräver ingen extra dep.
postgres = ["psycopg[binary]>=3.2"]
# Valfri tray-/menubar-klient (steg 2). Kräver en display. `uv sync --extra tray`.
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
# Enhetlig CLI: `serrier up|down|status | run -- <cmd> | scan <path>`
serrier = "serrier.cli_main:main"
# CLI-wrapper (model C): `serrier-guard run -- <kommando>`
serrier-guard = "serrier.guardian.run:main"
# Lokal skanning utan server: `serrier-scan <sökväg>`
serrier-scan = "serrier.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PL", "RUF", "ANN", "PT"]
# RUF001-003: typografiska tecken i kommentarer; PLC2401/2403: svenska identifierare —
# allt avsiktligt (projektets språk är svenska).
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "PLC2401", "PLC2403"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "ANN", "PLR2004", "PLR0913", "PLR0917"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["serrier*"]

# Icke-Python-filer som koden läser vid körning måste följa med i wheeln (annars saknar
# en installerad semgrep-adapter sina regler).
[tool.setuptools.package-data]
"serrier.scanners" = ["semgrep_rules/*.yaml"]

[build-system]
requires = ["setuptools>=77"]   # >=77: SPDX-licensfält (PEP 639)
build-backend = "setuptools.build_meta"
