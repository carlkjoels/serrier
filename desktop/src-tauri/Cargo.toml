# Serrier desktop (Tauri v2). Scaffold — byggs på maskin med Rust-toolchain (se desktop/README).
[package]
name = "serrier-desktop"
version = "0.0.1"
edition = "2021"
description = "Serrier — AI Security Runtime (desktop shell)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
